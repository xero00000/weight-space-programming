name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tensor-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt PyYAML
      - run: python -m unittest discover -s tests -v
      - name: Validate skill metadata and references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml
          skill = Path('SKILL.md').read_text()
          front = yaml.safe_load(skill.split('---', 2)[1])
          assert front['name'] == 'weight-space-programming'
          assert isinstance(front['description'], str) and front['description'].strip()
          for path in [Path('SKILL.md'), Path('README.md'), *Path('references').glob('*.md')]:
              for link in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if not link.startswith(('https://', 'http://', '#')):
                      assert (path.parent / link).is_file(), (str(path), link)
          ui = yaml.safe_load(Path('agents/openai.yaml').read_text())
          assert '$weight-space-programming' in ui['interface']['default_prompt']
          PY
